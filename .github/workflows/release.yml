name: release
on:
  push:
    tags: ["v*"]

# Nothing to publish here -- users clone the repo and run launch.command. This just runs the full
# CI suite against the tag and creates a GitHub Release with generated notes.
jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
