coverage:
  status:
    project:
      default:
        # Honest measured baseline, not the 80% goal -- see README.md's "Test coverage" section.
        # threshold: 0 means this can only ratchet UP over time as tests are added; it must never
        # be lowered to make a PR pass. Was originally set to 15% by mistake (the real measured
        # figure at the time was 14%, per the launch notes); corrected to 14% here after real
        # Codecov data on live PRs came back at 14.29%, just under the wrong 15% target.
        target: 14%
        threshold: 0
    patch:
      default:
        # New code is held to the real bar from day one, even while the overall project ratchets
        # up toward it.
        target: 80%
comment:
  layout: "condensed_header, diff, flags"
